name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ulsan-ai-ht-team07
            git pull origin main

            # Backend 배포
            npm install
            npm run build
            pm2 restart ildan-nawa-backend || pm2 start dist/index.js --name ildan-nawa-backend

            # Frontend 빌드 & S3 업로드 (EC2 Role 권한 사용)
            cd frontend
            npm install
            npm run build
            aws s3 sync dist/ s3://ulsan-ht-team-7-s3 --delete
